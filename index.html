<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071426" />
  <meta name="description" content="VESCO CONTROL — Logística inteligente em tempo real" />
  <title>VESCO CONTROL — Logística Inteligente</title>

  <!-- Evita que o navegador mantenha uma versão operacional antiga. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <!-- Arquivos visuais locais. -->
  <link rel="stylesheet" href="styles.css?v=1028" />
  <link rel="stylesheet" href="vesco-v8-operacional.css?v=1028" />

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eaf2fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    #vescoBoot {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(34, 211, 238, 0.18), transparent 32%),
        radial-gradient(circle at 90% 0%, rgba(37, 99, 235, 0.15), transparent 34%),
        linear-gradient(135deg, #071426, #0b1f3a);
      color: #fff;
    }

    .vesco-boot-card {
      width: min(420px, calc(100vw - 32px));
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
    }

    .vesco-boot-logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #22d3ee, #1769ff);
      box-shadow: 0 18px 38px rgba(23, 105, 255, 0.35);
      font-size: 28px;
      font-weight: 1000;
    }

    .vesco-boot-card h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .vesco-boot-card p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
    }

    .vesco-boot-loader {
      width: 100%;
      height: 10px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .vesco-boot-loader span {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22d3ee, #22c55e, #1769ff);
      animation: vescoBoot 1.15s infinite ease-in-out;
    }

    @keyframes vescoBoot {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    .vesco-boot-error {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(248, 113, 113, 0.38);
      background: rgba(239, 68, 68, 0.14);
      color: #fecaca;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <div id="vescoBoot" role="status" aria-live="polite">
    <div class="vesco-boot-card">
      <div class="vesco-boot-logo">V</div>
      <h1>VESCO CONTROL</h1>
      <p>Carregando logística inteligente em tempo real...</p>
      <div class="vesco-boot-loader"><span></span></div>
      <div id="vescoBootError" class="vesco-boot-error"></div>
    </div>
  </div>

  <noscript>
    <div style="padding: 24px; font-family: Arial, sans-serif">
      Para usar o VESCO CONTROL, ative o JavaScript no navegador.
    </div>
  </noscript>

  <script>
    window.VESCO_BUILD_VERSION = "V10.28-REALTIME";
    window.VESCO_INDEX_VERSION = "index-v10.28-realtime";

    // API principal do painel ERP/logística.
    window.VESCO_API_URL =
      window.VESCO_API_URL ||
      "https://script.google.com/macros/s/AKfycbxEzbxBABMDwi7B7tn_1p-lC0vc50JjHFOrH3w42Oog2-5R2-WMYSrQ27ED7wduJUN6/exec";

    // Bridge Flex que lê a aba Pedidos_Teste alimentada pelo EasyPanel.
    window.VESCO_API_FLEX_URL =
      window.VESCO_API_FLEX_URL ||
      "https://script.google.com/macros/s/AKfycbyJXPpN3D8yrcRb0LCy8CY8vegzzF-vKkj7YPmx8WVGouAhBvj_5D_qxhSfyIYTacL1/exec";

    window.addEventListener("error", function (event) {
      console.error("VESCO GlobalError:", event.error || event.message || event);

      var box = document.getElementById("vescoBootError");
      if (box && !(window.VescoV8 && window.VescoV8.__v1028)) {
        box.style.display = "block";
        box.textContent =
          "Erro ao carregar o painel: " +
          (event.message || "verifique o Console do navegador.");
      }
    });

    window.addEventListener("unhandledrejection", function (event) {
      console.error("VESCO PromiseError:", event.reason || event);
    });
  </script>

  <!--
    ORDEM OBRIGATÓRIA V10.28:
    1. Configuração/SDK Firebase
    2. Leaflet
    3. Núcleo operacional
    4. Listener Firebase Realtime Light

    Não carregue junto modulo.rotas.js, V7, V7.2, V9 ou outro núcleo V10 antigo.
  -->
  <script src="firebase-config.js?v=1028"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="modulo.vesco-v8-operacional.js?v=1028"></script>
  <script src="vesco-firebase-realtime.js?v=1028"></script>

  <script>
    (function () {
      "use strict";

      var MAX_TRIES = 120;
      var INTERVAL_MS = 250;

      function bootError(message) {
        var box = document.getElementById("vescoBootError");
        if (!box) return;
        box.style.display = "block";
        box.textContent = message;
      }

      function hideBoot() {
        var boot = document.getElementById("vescoBoot");
        if (!boot) return;

        boot.style.opacity = "0";
        boot.style.pointerEvents = "none";
        boot.style.transition = "opacity 0.22s ease";

        setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, 260);
      }

      function checkReady() {
        if (window.VescoV8 && window.VescoV8.__v1028) {
          hideBoot();
          console.log(
            "VESCO index V10.28 Realtime carregado com sucesso.",
            window.VescoV8.realtimeStatus
              ? window.VescoV8.realtimeStatus()
              : "realtime iniciando"
          );
          return true;
        }

        return false;
      }

      if (!checkReady()) {
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;

          if (checkReady()) {
            clearInterval(timer);
            return;
          }

          if (tries >= MAX_TRIES) {
            clearInterval(timer);

            if (window.VescoV8 && !window.VescoV8.__v1028) {
              bootError(
                "O navegador carregou um módulo operacional antigo. Pressione Ctrl + F5 e confirme que o arquivo modulo.vesco-v8-operacional.js está publicado como V10.28."
              );
              return;
            }

            bootError(
              "O módulo V10.28 não iniciou. Confirme no GitHub/Vercel os arquivos modulo.vesco-v8-operacional.js e vesco-firebase-realtime.js."
            );
          }
        }, INTERVAL_MS);
      }

      window.VESCO_DEBUG = function () {
        var core = window.VescoV8 || null;

        return {
          index: window.VESCO_INDEX_VERSION,
          build: window.VESCO_BUILD_VERSION,
          VescoV8: !!core,
          v1028: !!(core && core.__v1028),
          realtime:
            core && typeof core.realtimeStatus === "function"
              ? core.realtimeStatus()
              : null,
          debug:
            core && typeof core.debug === "function"
              ? core.debug()
              : null,
          apiPrincipal: window.VESCO_API_URL,
          apiFlex: window.VESCO_API_FLEX_URL
        };
      };
    })();
  </script>
</body>
</html>
