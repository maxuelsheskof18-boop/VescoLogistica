  async function viaCepLookup(cep){
    cep=String(cep||"").replace(/\D/g,"");
    if(cep.length!==8) return null;
    const cached=state.cepCache?.[cep];
    if(cached && Date.now()-Number(cached.ts||0)<2592000000) return cached.erro?null:cached;
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),5000);
    try{
      const res=await fetch(`https://viacep.com.br/ws/${cep}/json/`,{signal:ctrl.signal,cache:"force-cache"});
      if(!res.ok) return null;
      const data=await res.json();
      state.cepCache[cep]={...data,ts:Date.now()};
      saveLocalJson("vesco:v1050:cepCache",state.cepCache);
      return data && !data.erro ? data : null;
    }catch(e){ return null; }finally{ clearTimeout(timer); }
  }
  function houseNumberFromAddress(a){
    const parts=cleanDisplayAddress(a).split(",").map(x=>x.trim());
    for(let i=1;i<Math.min(parts.length,4);i++){ const m=parts[i].match(/^\d+[A-Za-z\-\/]{0,5}/); if(m) return m[0]; }
    const m=cleanDisplayAddress(a).match(/\b(?:n[ºo.]?\s*)?(\d+[A-Za-z\-\/]{0,5})\b/i);
    return m?m[1]:"";
  }
  async function geocodeAddressViaFlexApi(endereco){
    const a=cleanDisplayAddress(endereco);
    if(!a || a==="—" || a==="-") return null;
    const local=cachedGeoForAddress(a);
    if(local && coordCompatibleWithAddress(a,parseFloat(local.lat),parseFloat(local.lon??local.lng))) return local;

    let candidates=geocodeCandidates(a);
    const cep=extractCep(a);
    if(cep){
      const via=await viaCepLookup(cep);
      if(via){
        const number=houseNumberFromAddress(a);
        const byCep=[via.logradouro,number,via.bairro,via.localidade,via.uf,cep,"Brasil"].filter(Boolean).join(", ");
        candidates=[byCep,...candidates.filter(x=>addressKey(x)!==addressKey(byCep))];
      }
    }
    const cacheKey="v1050:"+candidates.join("||");
    const cached=state.geoCache[cacheKey];
    if(cached && cached.status==="OK" && coordCompatibleWithAddress(a,parseFloat(cached.lat),parseFloat(cached.lon??cached.lng))) return cached;

    for(const q of candidates){
      try{
        const res=await jsonp(API_FLEX,{action:"geocodeEndereco",endereco:q,address:q,original:a,forcar_sp:explicitSaoPauloCity(a)?1:0},12000);
        const out=(res && res.status==="OK")?res:(res?.resultado?.status==="OK"?res.resultado:res);
        const lat=parseFloat(String(out?.lat).replace(",","."));
        const lon=parseFloat(String(out?.lon??out?.lng).replace(",","."));
        if(out && out.status==="OK" && coordCompatibleWithAddress(a,lat,lon)){
          const good={...out,lat,lon,lng:lon,source:out.source||out.provider||"apps_script",query:q,status:"OK"};
          state.geoCache[cacheKey]=good; rememberGeoForAddress(a,good); return good;
        }
      }catch(e){}
    }

    for(const q of candidates.slice(0,2)){
      try{
        const out=await geocodeNominatim(q,a);
        if(out && out.status==="OK"){ state.geoCache[cacheKey]=out; rememberGeoForAddress(a,out); return out; }
      }catch(e){}
    }
    return {status:"ZERO_RESULTS",query:candidates[0]||a,ts:Date.now()};
  }
  function applyGeoToOrder(o, ge){
    if(!o || !ge || ge.status!=="OK") return false;
    const lat=parseFloat(String(ge.lat).replace(",","."));
    const lon=parseFloat(String(ge.lon ?? ge.lng).replace(",","."));
    if(!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
    if(!coordCompatibleWithAddress(o,lat,lon)) return false;
    o.lat=lat;
    o.lon=lon;
    o.latitude=lat;
    o.longitude=lon;
    o.geocode_status="OK_AUTO_MAP_V1051";
    o.geocode_source=ge.source||"auto";
    rememberGeoForAddress(address(o),{...ge,lat,lon,status:"OK"});
    return true;
  }
  async function persistGeoPatch(o){
    const id=orderKey(o)||number(o)||o?.id||o?.id_tiny;
    if(!id) return false;
    const patch={

      return false;
    }
  }

  async function autoGeocodeMap(type,list,force=false){
    const key=`${type}:${state.tab}:${state.date}:${state.month}`;
    if(state.geoAutoRunning[key]) return false;
    const candidates=(list||[]).filter(o=>hasAddress(o) && (force || !coords(o)));
    if(!candidates.length) return false;

    const groups=new Map();
    for(const o of candidates){
      const k=addressKey(address(o));
      if(!k) continue;
      if(!groups.has(k)) groups.set(k,[]);
      groups.get(k).push(o);
    }
    const jobs=[...groups.values()].slice(0,VESCO_GEO_BATCH_LIMIT);
    if(!jobs.length) return false;
    state.geoAutoRunning[key]=true;
    let updated=0,fail=0,done=0;
    const stats=document.getElementById(`v8-map-${type}-stats`);
    const setProgress=()=>{
      const el=document.getElementById(`v8-map-${type}-geo-progress`);
      if(el) el.textContent=`Localizando ${done}/${jobs.length} endereço(s)`;
    };
    if(stats) stats.insertAdjacentHTML("beforeend",`<span id="v8-map-${type}-geo-progress" class="warn">Localizando 0/${jobs.length} endereço(s)</span>`);

    async function runGroup(group){
      const ge=await geocodeAddressViaFlexApi(address(group[0]));
      if(ge && ge.status==="OK"){
        for(const o of group){ if(applyGeoToOrder(o,ge)){ updated++; persistGeoPatch(o).catch(()=>null); } }
      }else fail+=group.length;
      done++; setProgress();
      if(done===jobs.length || done%VESCO_GEO_CONCURRENCY===0){
        renderMap(type,false,list);
        await sleep(0);
      }
    }

    try{
      for(let i=0;i<jobs.length;i+=VESCO_GEO_CONCURRENCY){
        await Promise.allSettled(jobs.slice(i,i+VESCO_GEO_CONCURRENCY).map(runGroup));
      }
      if(updated){
        saveLocalSnapshot(snapshotFromState());
        if(stats) stats.insertAdjacentHTML("beforeend",`<span class="ok">${updated} pedido(s) localizado(s) e salvo(s)</span>`);
      }else if(fail && stats){
        stats.insertAdjacentHTML("beforeend",`<span class="warn">${fail} sem resultado; revise rua, número ou CEP</span>`);
      }
      renderMap(type,false,list);
      return updated>0;
    }finally{
      state.geoAutoRunning[key]=false;
      document.getElementById(`v8-map-${type}-geo-progress`)?.remove();
    }
  }

    const run=()=>{
      const forceNow=v1053RenderForce;
      const wait=Math.max(0,Number(state.userNavigatingUntil||0)-Date.now());
      if(wait>0 && !forceNow){ setTimeout(run,Math.min(wait+16,220)); return; }

  function routeOriginLatLon(){
    return [-23.541652,-46.604720]; // Rua São Leopoldo 92
  }
  function routeDirectionKey(points){
    return points.map(p=>`${p[0].toFixed(5)},${p[1].toFixed(5)}`).join("|");
  }
  function formatDistance(m){
    const n=Number(m||0);
    return n>=1000 ? `${(n/1000).toFixed(1).replace(".",",")} km` : `${Math.round(n)} m`;
  }
  function formatDuration(sec){
    const m=Math.round(Number(sec||0)/60);
    if(m<60) return `${m} min`;
    return `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}min`;

  function straightDistanceMeters(points){
    let total=0;
    for(let i=1;i<points.length;i++){
      const [aLat,aLon]=points[i-1], [bLat,bLon]=points[i];
      const R=6371000, toRad=x=>x*Math.PI/180;
      const dLat=toRad(bLat-aLat), dLon=toRad(bLon-aLon);
      const s=Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLon/2)**2;
      total += 2*R*Math.asin(Math.sqrt(s));
    }
    return total;
  }
  async function drawRouteDirections(type,map,layer,orders){
    if(type!=="logistica" || !orders || !orders.length || typeof L==="undefined") return;
    const plotted=orders.filter(coords);
    if(!plotted.length) return;
    const points=[routeOriginLatLon()].concat(plotted.map(o=>{const c=coords(o); return [c.lat,c.lon];}));
    if(points.length<2) return;

    const key=routeDirectionKey(points);
    const stats=document.getElementById(`v8-map-${type}-stats`);
    try{
      if(state.routeDirections[key]){
        const cached=state.routeDirections[key];
        if(cached.geometry){
          L.polyline(cached.geometry,{weight:6,opacity:.9,className:"v117-route-line"}).addTo(layer);
        }
        if(stats) stats.innerHTML += `<span class="ok">Rota: ${formatDistance(cached.distance)} • ${formatDuration(cached.duration)}</span>`;
        return;
      }

      if(stats) stats.innerHTML += `<span class="warn">Calculando rota...</span>`;
      const coordStr=points.map(p=>`${p[1]},${p[0]}`).join(";");
      const url=`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson&steps=false`;
      const resp=await fetch(url);
      const data=await resp.json();
      const route=data && data.routes && data.routes[0];
      if(route && route.geometry && route.geometry.coordinates){
        const geometry=route.geometry.coordinates.map(c=>[c[1],c[0]]);
        state.routeDirections[key]={geometry,distance:route.distance,duration:route.duration};
        L.polyline(geometry,{weight:6,opacity:.9,className:"v117-route-line"}).addTo(layer);
        if(stats){
          const base=stats.innerHTML.replace('<span class="warn">Calculando rota...</span>',"");
          stats.innerHTML=base + `<span class="ok">Rota: ${formatDistance(route.distance)} • ${formatDuration(route.duration)}</span>`;
        }
      }else{
        throw new Error("OSRM sem rota");
      }
    }catch(e){
      const dist=straightDistanceMeters(points);
      L.polyline(points,{weight:5,opacity:.7,dashArray:"8 8",className:"v117-route-fallback"}).addTo(layer);
      if(stats){
        const base=stats.innerHTML.replace('<span class="warn">Calculando rota...</span>',"");
        stats.innerHTML=base + `<span class="warn">Rota aproximada: ${formatDistance(dist)} • ${formatDuration(dist/9)}</span>`;
      }
    }
  }

function renderMap(type,forceFit=false,listOverride=null){
    const map=ensureMap(type);
    if(!map) return false;
    const listFull=Array.isArray(listOverride)?listOverride:listForMap(type);
    const plottedFull=listFull.filter(coords);
    const plotted=plottedFull.slice(0, Math.max(1, VESCO_MAP_LIMIT));
    const pts=[];
    state.markers[type]={};
    state.layers[type].clearLayers();
    plotted.forEach((o,i)=>{
      const c=coords(o);
      const n=number(o)||orderKey(o)||ecom(o);
      const m=L.marker([c.lat,c.lon],{icon:mapIcon(type,type==="flex"?"F":String(i+1)),title:`#${n} ${client(o)}`});
      m.bindPopup(`<div style="font-size:12px;line-height:1.35;min-width:220px"><b>#${esc(n)} — ${esc(client(o))}</b><br>${esc(address(o)||"Coordenada informada")}<br><small>${esc(status(o)||"Pendente")}</small></div>`);
      m.addTo(state.layers[type]);
      keys(o).forEach(k=>state.markers[type][k]=m);
      pts.push([c.lat,c.lon]);
    });
    const stats=document.getElementById(`v8-map-${type}-stats`);
    if(stats){
      const missingAddress=listFull.filter(o=>!coords(o)&&hasAddress(o)).length;
      const rejected=listFull.filter(o=>txt(o.geocode_status).includes("FORA_DE_SP")).length;
      const limited = plottedFull.length > plotted.length;
      const noCoord=listFull.length-plottedFull.length;
      stats.innerHTML=`<span class="ok">${plotted.length}/${listFull.length} no mapa</span>${noCoord?`<span class="warn">${noCoord} aguardando localização automática</span>`:""}${limited?`<span class="warn">exibindo ${plotted.length} pins no modo rápido</span>`:""}${rejected?`<span class="warn">${rejected} coordenada incompatível descartada</span>`:""}${missingAddress?`<button class="v8-mini-btn" onclick="VescoV8.gerarPingsMapa('${type}')">Localizar agora</button>`:""}`;
    }
    const fitKey=`${type}|${plotted.map(o=>number(o)||orderKey(o)||ecom(o)).join(",")}`;
    const shouldFit=!!forceFit && state.mapFitKeys[type]!==fitKey;
    if(shouldFit) state.mapFitKeys[type]=fitKey;
    requestAnimationFrame(()=>{try{map.invalidateSize(false); if(pts.length&&shouldFit){ if(pts.length===1) map.setView(pts[0],15,{animate:false}); else map.fitBounds(L.latLngBounds(pts).pad(.16),{maxZoom:14,animate:false}); }}catch(e){}});

    // V10.35: não calcula rota OSRM automaticamente e não roda geocode em cada troca de módulo.
    if(type==="logistica" && plotted.length && VESCO_ROUTE_LINE){
      setTimeout(()=>drawRouteDirections(type,map,state.layers[type],plotted),180);
    }
    if(VESCO_AUTO_GEOCODE && (listFull.length-plottedFull.length)>0){
      setTimeout(()=>autoGeocodeMap(type,listFull),350);
    }
    return true;
  }

  <script>// vesco-firebase-realtime.js — VESCO CONTROL V10.47 FIREBASE LIMPO
// Sincroniza operadores em tempo real via Firebase Realtime Database.
// Carregar depois de firebase-config.js e depois de modulo.vesco-v8-operacional.js.

(function(){
  if(window.__VESCO_FIREBASE_REALTIME_V1042) return;
  window.__VESCO_FIREBASE_REALTIME_V1042 = true;

  const SDK_APP = "https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js";
  const SDK_DB  = "https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js";

  const ROUTES_PATH = "vesco_rotas_motorista";
  const ORDERS_PATH = "vesco_operacao/orders";
  const EVENTS_PATH = "vesco_operacao/eventos";

  let app = null;
  let db = null;
  let initialized = false;
  let lastOrdersPatch = {};
  let lastRoutes = [];
  let orderListenerReady = false;

  function txt(v){ return String(v ?? "").trim(); }
  function norm(v){ return txt(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
  function escKey(v){ return txt(v).replace(/[.#$/\[\]]/g,"_") || ("key_" + Date.now()); }
  function now(){ return new Date().toISOString(); }

  function loadScript(src){
    return new Promise((resolve,reject)=>{
      if(Array.from(document.scripts).some(s=>s.src===src)) return resolve();
      const s=document.createElement("script");
      s.src=src;
      s.async=true;
      s.onload=resolve;
      s.onerror=()=>reject(new Error("Falha ao carregar " + src));
      document.head.appendChild(s);
    });
  }

  async function ensureFirebase(){
    if(initialized && db) return db;
    const cfg = window.VESCO_FIREBASE_CONFIG || window.firebaseConfig || {
      apiKey: "AIzaSyDvQhoV0x6B9cTnouzvOxyfqXRtsG2nKq0",
      authDomain: "dashlogistica-49689.firebaseapp.com",
      databaseURL: "https://dashlogistica-49689-default-rtdb.firebaseio.com",
      projectId: "dashlogistica-49689",
      storageBucket: "dashlogistica-49689.firebasestorage.app",
      messagingSenderId: "833809141353",
      appId: "1:833809141353:web:c92b18ee10d9fc91c29cf8",
      measurementId: "G-NRYTBELTJ0"
    };

    await loadScript(SDK_APP);
    await loadScript(SDK_DB);

    if(!window.firebase) throw new Error("Firebase SDK não carregou.");

    try{
      app = window.firebase.apps && window.firebase.apps.length
        ? window.firebase.app()
        : window.firebase.initializeApp(cfg);
    }catch(e){
      app = window.firebase.app();
    }

    db = window.firebase.database(app);
    initialized = true;
    console.log("VESCO Firebase V10.47 conectado:", cfg.databaseURL);
    return db;
  }

  function getV8(){
    return window.VescoV8 || null;
  }

  function orderKeys(o){
    if(!o) return [];
    return [
      o.id, o.pedido_key, o.numero, o.pedido, o.id_tiny, o.numero_ecommerce, o.ecom
    ].map(txt).filter(Boolean);
  }

  function orderVals(o){
    return [o?.pedido_key,o?.id,o?.id_tiny,o?.numero,o?.numero_ecommerce,o?.pedido,o?.pedido_id,o?.pedido_numero]
      .map(txt).filter(Boolean);
  }
  function findOrderById(id){
    const v8=getV8();
    if(!v8 || !v8.state) return null;
    const key=escKey(id);
    const all=[...(v8.state.orders||[]), ...(v8.state.flex||[])];
    return all.find(o=>orderVals(o).some(v=>v===txt(id) || escKey(v)===key || escKey(v)===escKey(id))) || null;
  }

  function applyOrderPatchToState(id, patch){
    const v8=getV8();
    if(!v8 || !v8.state) return false;
    let o=findOrderById(id);
    if(o){
      Object.assign(o, patch || {});
      return true;
    }

    // V10.47: não cria mais pedidos fantasmas no state.orders.
    // Se o pedido não veio da planilha/API atual, o patch fica salvo no Firebase,
    // mas não polui Retiradas/Sem rota.
    return false;
  }

  function applyAllOrderPatches(patches){
    if(!patches || typeof patches!=="object") return 0;
    let applied=0;
    Object.keys(patches).forEach(id=>{
      const patch=patches[id] || {};
      if(applyOrderPatchToState(id, patch)) applied++;
    });
    return applied;
  }

  function normalizeRoute(r, id){
    if(!r) return null;
    const rota = Object.assign({}, r);
    rota.rota_id = txt(rota.rota_id || rota.id || id);
    rota.id = rota.rota_id;
    rota.token = txt(rota.token || rota.motorista_token || "");
    rota.nome_rota = txt(rota.nome_rota || rota.nome || "Rota");
    rota.nome = rota.nome_rota;

    let paradas = rota.paradas;
    if(!Array.isArray(paradas)){
      try{ paradas = JSON.parse(rota.paradas_json || "[]"); }catch(e){ paradas=[]; }
    }

    const entregas = rota.entregas || {};
    paradas = (paradas || []).map(p=>{
      const key=txt(p.pedido || p.numero || p.id || p.ecom);
      const ent = entregas[escKey(key)] || entregas[key] || null;
      return ent ? Object.assign({}, p, ent, {status_logistica:"Entregue"}) : p;
    });

    rota.paradas = paradas;
    rota.paradas_json = JSON.stringify(paradas);
    return rota;
  }

  function applyRoutesToState(routesObj){
    const v8=getV8();
    if(!v8 || !v8.state) return 0;

    const routes = Object.keys(routesObj || {})
      .map(id=>normalizeRoute(routesObj[id], id))
      .filter(Boolean)
      .sort((a,b)=>txt(b.criado_em || b.atualizado_em).localeCompare(txt(a.criado_em || a.atualizado_em)));

    lastRoutes = routes;

    const byId=new Map();
    [...routes, ...(v8.state.rotas||[])].forEach(r=>{
      const id=txt(r.rota_id || r.id || r.rota);
      if(id && !byId.has(id)) byId.set(id,r);
    });

    v8.state.rotas = Array.from(byId.values());

    // Se tiver entregas em rota, também atualiza os pedidos carregados.
    routes.forEach(r=>{
      const entregas = r.entregas || {};
      Object.keys(entregas).forEach(k=>{
        const ent=entregas[k] || {};
        const pedido=ent.pedido || k;
        applyOrderPatchToState(pedido, {
          status_logistica: ent.tipo_finalizacao==="Retirada" ? "Retirado" : "Entregue",
          situacao_nome: ent.tipo_finalizacao==="Retirada" ? "Retirado" : "Entregue",
          is_delivered:true,
          recebedor:ent.recebedor || ent.nome_recebedor || "",
          nome_recebedor:ent.recebedor || ent.nome_recebedor || "",
          doc_recebedor:ent.documento || ent.doc_recebedor || "",
          data_entrega_realizada:ent.data_entrega_realizada || new Date().toLocaleDateString("pt-BR"),
          entregue_em:ent.entregue_em || ent.updated_at || now()
        });

        // V10.47: mesmo se o pedido não estiver carregado no ERP, aparece em Entregues.
        const v8=getV8();
        if(v8 && v8.state){
          v8.state.deliveredExternal = Array.isArray(v8.state.deliveredExternal) ? v8.state.deliveredExternal : [];
          const exists=v8.state.deliveredExternal.some(x=>txt(x.pedido_numero||x.pedido||x.numero)===txt(pedido));
          if(!exists){
            const stop=(r.paradas||[]).find(s=>[s.pedido,s.numero,s.id,s.ecom].map(txt).includes(txt(pedido))) || {};
            v8.state.deliveredExternal.push(Object.assign({}, stop, ent, {
              rota_id:r.rota_id || r.id,
              pedido_numero:pedido,
              pedido_id:pedido,
              cliente_nome:stop.cliente || ent.cliente || "",
              endereco_completo:stop.endereco || "",
              status_logistica:"Entregue",
              situacao_nome:"Entregue",
              is_delivered:true,
              data_entrega_realizada:ent.data_entrega_realizada || new Date().toLocaleDateString("pt-BR"),
              entregue_em:ent.entregue_em || ent.updated_at || now()
            }));
          }
        }
      });
    });

    return routes.length;
  }

  async function saveOrderPatch(id, patch){
    const d=await ensureFirebase();
    if(!d) return null;
    const key=escKey(id);
    const payload=Object.assign({}, patch || {}, {updated_at:now()});
    await d.ref(`${ORDERS_PATH}/${key}`).update(payload);
    await d.ref(`${EVENTS_PATH}`).push({type:"order_patch", id, patch:payload, ts:now()});
    applyOrderPatchToState(id, payload);
    try{ getV8()?.render?.(); }catch(e){}
    return payload;
  }

  async function saveRoute(route){
    const d=await ensureFirebase();
    if(!d) return null;
    const id=txt(route.rota_id || route.id || route.rota || ("rota-" + Date.now()));
    const payload=Object.assign({}, route, {rota_id:id, id, atualizado_em:now(), fonte:"vesco_v10"});
    await d.ref(`${ROUTES_PATH}/${escKey(id)}`).set(payload);
    return payload;
  }

  async function confirmDelivery({rotaId, token, pedido, recebedor, documento, transportador, observacao}){
    const d=await ensureFirebase();
    if(!d) throw new Error("Firebase não conectado.");

    const dataBR=new Date().toLocaleDateString("pt-BR");
    const payload={
      pedido,
      recebedor,
      documento,
      transportador:transportador || "Painel Vesco",
      observacao:observacao || "",
      status_logistica:"Entregue",
      data_entrega_realizada:dataBR,
      entregue_em:now(),
      updated_at:now()
    };

    await d.ref(`${ROUTES_PATH}/${escKey(rotaId)}/entregas/${escKey(pedido)}`).set(payload);

      const rows=Array.isArray(rp?.rotas)?rp.rotas:Array.isArray(rp?.data)?rp.data:Array.isArray(rp?.rows)?rp.rows:[];
      if(rows.length) return applyRoutes(rows,'apps_script_fallback');
    }catch(e){console.warn('V10.63 fallback rotas Apps Script:',e.message||e)}
    return 0;
  }

  function orderCode(o){return txt(o?.numero||o?.pedido||o?.pedido_numero||o?.id||o?.pedido_key||o?.id_tiny||o?.numero_ecommerce)}
  function routeStops(r){if(Array.isArray(r?.paradas))return r.paradas.map(x=>Object.assign({},x));try{return JSON.parse(r?.paradas_json||'[]')}catch(e){return []}}
  function orderMatches(o,code){
    const c=txt(code).replace(/^#/,''); const d=c.replace(/\D/g,'');
    const vals=[o?.numero,o?.pedido,o?.pedido_numero,o?.id,o?.pedido_key,o?.id_tiny,o?.numero_ecommerce,o?.ecom].map(txt).filter(Boolean);
    return vals.some(v=>{v=v.replace(/^#/,'');return v===c||(d&&v.replace(/\D/g,'')===d)});
  }
  function findOrder(code){const v=V8();return [...(v?.state?.orders||[]),...(v?.state?.flex||[])].find(o=>orderMatches(o,code))||null}
  function stopFromOrder(o){
    const isFlex=!!o?.is_flex||txt(o?.__rotaSource)==='Flex'||txt(o?.__source)==='flex';
    return {pedido:orderCode(o),id:txt(o?.pedido_key||o?.id||orderCode(o)),ecom:txt(o?.numero_ecommerce||o?.ecom||''),cliente:txt(o?.cliente_nome||o?.cliente||o?.destinatario||'Cliente'),endereco:txt(o?.endereco_completo||o?.endereco||o?.address||''),lat:o?.lat||o?.latitude||'',lon:o?.lon||o?.lng||o?.longitude||'',tipo:isFlex?'Flex':'ERP',is_flex:isFlex,valor:o?.valor||o?.total||'',conta:txt(o?.conta_tiny||o?.conta||o?.loja||'')};
  }
  function stopCode(s){return txt(s?.pedido||s?.numero||s?.id||s?.pedido_id||s?.ecom||s?.numero_ecommerce)}

  function ensureEditModal(){
    if(!document.getElementById('v1063-route-edit-css')){
      const st=document.createElement('style');st.id='v1063-route-edit-css';st.textContent=`
      .v1063-modal{position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.68);display:none;place-items:center;padding:18px}.v1063-modal.open{display:grid}.v1063-card{width:min(920px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 25px 80px #0004}.v1063-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.v1063-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.v1063-grid label{display:grid;gap:5px;font-weight:700;font-size:12px}.v1063-grid input,.v1063-add input{padding:10px;border:1px solid #cbd5e1;border-radius:9px}.v1063-wide{grid-column:1/-1}.v1063-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.v1063-stop{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid #e2e8f0;border-radius:10px;margin:7px 0;background:#f8fafc}.v1063-num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#1769ff;color:white;font-weight:800}.v1063-actions{display:flex;gap:5px;flex-wrap:wrap}.v1063-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:700px){.v1063-grid{grid-template-columns:1fr}.v1063-wide{grid-column:auto}.v1063-stop{grid-template-columns:32px 1fr}.v1063-actions{grid-column:1/-1}}`;document.head.appendChild(st);
    }
    let m=document.getElementById('v1063RouteEditModal'); if(!m){m=document.createElement('div');m.id='v1063RouteEditModal';m.className='v1063-modal';m.onclick=e=>{if(e.target===m) closeEdit()};document.body.appendChild(m)} return m;
  }
  function renderEdit(){
    const m=ensureEditModal(); if(!routeEditDraft){m.classList.remove('open');m.innerHTML='';return}
    const stops=routeEditDraft.stops||[];
    m.innerHTML=`<div class="v1063-card"><div class="v1063-head"><div><h3>Editar rota</h3><small>${routeEditDraft.id}</small></div><button class="v8-btn secondary" onclick="VescoV8.closeEditRouteModal()">Fechar</button></div><div class="v1063-grid"><label>Nome<input id="v1063Nome" value="${routeEditDraft.nome.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></label><label>Motorista<input id="v1063Motorista" value="${routeEditDraft.motorista.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></label><label class="v1063-wide">Origem<input id="v1063Origem" value="${routeEditDraft.origem.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></label></div><div class="v1063-add"><input id="v1063Add" placeholder="Pedido ERP, Flex ou e-commerce"><button class="v8-btn" onclick="VescoV8.routeEditAddOrder()">Adicionar pedido</button></div><div>${stops.length?stops.map((s,i)=>`<div class="v1063-stop"><span class="v1063-num">${i+1}</span><div><b>#${stopCode(s)||'—'} — ${txt(s.cliente||'Cliente')}</b><small>${txt(s.endereco||'Sem endereço')}</small></div><div class="v1063-actions"><button class="v8-btn secondary" onclick="VescoV8.routeEditMoveStop(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="v8-btn secondary" onclick="VescoV8.routeEditMoveStop(${i},1)" ${i===stops.length-1?'disabled':''}>↓</button><button class="v8-btn secondary" onclick="VescoV8.routeEditRemoveStop(${i})">Remover</button></div></div>`).join(''):'<div class="v8-empty">Nenhum pedido.</div>'}</div><div class="v1063-footer"><button class="v8-btn secondary" onclick="VescoV8.closeEditRouteModal()">Cancelar</button><button class="v8-btn green" onclick="VescoV8.saveRouteEdit()">Salvar alterações</button></div></div>`;m.classList.add('open');
  }
  function openEdit(id){const v=V8();const r=(v?.state?.rotas||[]).find(x=>routeId(x)===txt(id));if(!r){alert('Rota não encontrada.');return false}let stops=routeStops(r);if(!stops.length){let ps=Array.isArray(r.pedidos)?r.pedidos:[];stops=ps.map(c=>{const o=findOrder(c);return o?stopFromOrder(o):{pedido:c,id:c,cliente:'Pedido '+c,endereco:'',tipo:'ERP'}})}routeEditDraft={id:routeId(r),original:r,nome:txt(r.nome_rota||r.nome||'Rota'),motorista:txt(r.motorista||''),origem:txt(r.origem||'Rua São Leopoldo 92'),stops};renderEdit();return true}
  function closeEdit(){routeEditDraft=null;renderEdit()}
  function addEditOrder(){if(!routeEditDraft)return false;const inp=document.getElementById('v1063Add');const code=txt(inp?.value);if(!code)return false;const o=findOrder(code);if(!o){alert('Pedido não encontrado nos pedidos ERP/Flex carregados.');return false}if(routeEditDraft.stops.some(s=>stopCode(s)===orderCode(o))){alert('Pedido já está na rota.');return false}routeEditDraft.stops.push(stopFromOrder(o));if(inp)inp.value='';renderEdit();return true}
  function removeStop(i){if(!routeEditDraft)return;routeEditDraft.stops.splice(Number(i),1);renderEdit()}
  function moveStop(i,d){if(!routeEditDraft)return;i=Number(i);d=Number(d);const t=i+d;if(t<0||i<0||t>=routeEditDraft.stops.length)return;const [x]=routeEditDraft.stops.splice(i,1);routeEditDraft.stops.splice(t,0,x);renderEdit()}
  async function saveEdit(){
    if(!routeEditDraft)return false;const v=V8();const stops=routeEditDraft.stops.filter(Boolean);if(!stops.length){alert('A rota precisa ter pelo menos um pedido.');return false}
    const op=currentOperator(), now=new Date().toISOString();const original=(v.state.rotas||[]).find(r=>routeId(r)===routeEditDraft.id)||routeEditDraft.original||{};const pedidos=stops.map(stopCode).filter(Boolean);
    const updated=Object.assign({},original,{rota_id:routeEditDraft.id,id:routeEditDraft.id,nome_rota:txt(document.getElementById('v1063Nome')?.value)||'Rota',nome:txt(document.getElementById('v1063Nome')?.value)||'Rota',motorista:txt(document.getElementById('v1063Motorista')?.value),origem:txt(document.getElementById('v1063Origem')?.value)||'Rua São Leopoldo 92',pedidos,pedidos_json:JSON.stringify(pedidos),paradas:stops,paradas_json:JSON.stringify(stops),editado_em:now,atualizado_em:now,editado_por:op,atualizado_por:op,operador_ultima_alteracao:op,__local:true});
    v.state.rotas=[updated,...(v.state.rotas||[]).filter(r=>routeId(r)!==routeEditDraft.id)];writeLocalRoutes(v.state.rotas);closeEdit();try{v.renderProntoEnvio?.()}catch(e){}
    const fb=await v.saveRouteFirebase(updated);if(fb?.success){updated.__firebaseSaved=true;writeLocalRoutes(v.state.rotas);alert('Rota atualizada e sincronizada para todos os operadores.');return true}alert('Rota editada localmente, mas o Firebase não confirmou. O fallback do Apps Script continuará tentando recuperar as rotas compartilhadas.');return false;
  }

  function installV8(){
    const v=V8(); if(!v||v.__v1063Patched) return false; v.__v1063Patched=true;
    v.openEditRouteModal=openEdit;v.closeEditRouteModal=closeEdit;v.routeEditAddOrder=addEditOrder;v.routeEditRemoveStop=removeStop;v.routeEditMoveStop=moveStop;v.saveRouteEdit=saveEdit;
    v.realtimeStatus=()=>({attached:routeRealtimeAttached,mode:routeRealtimeMode,routeRealtime:true,lastAt:lastRouteRealtimeAt,routes:lastRouteRealtimeCount,error:lastRouteError||null,operator:currentOperator()});
    const oldDebug=v.debug?.bind(v); if(oldDebug)v.debug=()=>Object.assign({},oldDebug(),{version:'V10.63-ROTAS-REALTIME-OPERADOR',rotasRealtimeLeve:true,rotasAppsScriptFallback:true,operadorPersistente:true,prontoHistoricoSemData:true,edicaoRotas:true,realtime:v.realtimeStatus()});
    return true;
  }
  let tries=0;const boot=setInterval(()=>{tries++;if(installV8()){clearInterval(boot);startFirebaseRouteStream();syncRoutesAppsScript();appsTimer=setInterval(syncRoutesAppsScript,20000)}else if(tries>100)clearInterval(boot)},100);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetchFirebaseRoutes();syncRoutesAppsScript()}});
})();
